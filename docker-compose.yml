services:
  user-service:
    build: ./user-service
    image: user-service:1.0
    restart: unless-stopped
    expose:
      - "3000"
    networks: [app-network]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  product-service:
    build: ./product-service
    image: product-service:1.0
    restart: unless-stopped
    expose:
      - "3000"
    networks: [app-network]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  order-service:
    build: ./order-service
    image: order-service:1.0
    restart: unless-stopped
    expose:
      - "3000"
    networks: [app-network]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    restart: unless-stopped
    networks: [app-network]

networks:
  app-network:
    driver: bridge
